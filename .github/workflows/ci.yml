name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  # 每周跑一次，抓的是**上游漂移**：宿主 @deepseek-ai/dsh 与工具链升级不会伴随
  # 本仓的提交，只靠 push/PR 触发的门禁永远看不见它们。public 仓的标准 runner 免费。
  # 注意：public 仓 60 天无活动时，GitHub 会自动停用定时工作流——这不需要额外维护，
  # 但「上周没跑」不等于「上周全绿」，读结论时别把它当连续证据。
  schedule:
    - cron: "37 3 * * 1"
# 同一分支上后到的提交取消前一个。发布用的是另一套口径（publish.yml 的
# cancel-in-progress: false）——发布不能中途取消。
# 组的键里带 event_name：周度漂移检测与 main 上的 push 都落在 refs/heads/main 上，
# 只按 ref 分组会让后到的把先到的取消掉，而周度那一跑是「上游变了没有」的唯一信号，
# 被取消等于这一周没量到。取消只给 push 与 pull_request：同一分支连推几次时，旧那一轮
# 的五格矩阵没有任何人还要它的结论；其余事件各占一组，互不覆盖。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
# 门槛只需要读代码。写成白名单而不是省略：省略会拿到仓库默认权限，而默认可能是读写。
permissions:
  contents: read
jobs:
  gate:
    name: gate (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      # fail-fast: false —— 一格红不该藏起其余格的结论。矩阵的价值在于「哪一档坏了」，
      # 默认的快速失败会把它压成一个布尔值。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        exclude:
          # 平台行为与 node 版本是两个正交维度：macOS 那一格只跑 node 24，
          # 不让矩阵从 2 格变 4 格。全 9 仓的门禁在本机（darwin）上实跑通过，
          # 所以这一格验的是真实 darwin 行为，不是重复劳动。
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    # 官方对单 job 的上限是 6 小时，那是「系统允许」不是「应该允许」。不设这一行，
    # 一个卡住的 install 或测试会烧满 6 小时 runner 分钟才被杀，而期间没有任何信号。
    timeout-minutes: 35
    # 定时触发的运行会把整个矩阵跑一遍。这里**不能**用 job 级 if 去裁矩阵：
    # jobs.<job_id>.if 可用的上下文只有 github / needs / vars / inputs，没有 matrix，
    # 写 matrix.os 会被判「Invalid workflow file」而让整个工作流加载失败。
    # 想只跑主格只能放进 matrix 本身或拆成独立工作流；全矩阵每周跑一遍在 public 仓免费。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本仓的 workflow 不用 git 写动词，token 没必要留在 .git/config 里：
          # 后续步骤会跑仓库自己的 install/构建/测试脚本，也就跑得到依赖里的脚本。
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      # registry-url 留空：本仓 CI 不发布，装依赖走包自己的 .npmrc（@jayyuen66 指向公共 npm）。
      # 配上 registry-url 会让 setup-node 生成一份用户级 .npmrc，把 CI 的解析口径改成和开发者不一样。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，而不是在 CI 里静默改一份
      # lockfile 后继续跑——那样绿的是「CI 现场解出来的那棵树」，不是仓库里这一份。
      - run: pnpm install --frozen-lockfile
      # Windows 那一格是给 lib/project-key.ts 的分隔符归一兜底的：本机跑不到 win32 的
      # path.sep，注入 sep 只能测到纯字符串那半边，真实平台行为要在这台 runner 上才成立。
      - run: pnpm run check
      # 门禁不该改写仓库内容。只在 ubuntu 格判：win32 上 core.autocrlf 会让检出本身带上
      # CRLF，那与门禁无关。
      # 覆盖率只在一次运行的日志里滚一遍就没了，翻起来费劲。落成产物之后，
      # 「这次为什么掉了」可以直接把报告下下来看，而不必重跑一次。
      # 只收 ubuntu 的 node 24 那一格：其余格各传一份只会得到同样的报告。
      - name: 上传覆盖率报告
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          # 这里取 warn 而不是 error：这一步在 `if: always()` 下跑，而 coverage/
          # 由 `pnpm run check` 里的 vitest 产出——typecheck / lint / build 任一先红时
          # 目录根本不存在。此时判红会盖住真正的失败原因，还把后面的步骤一起中断。
          # 缺产物本身就是「门禁没跑完」的信号，不需要这一步再报一次。
          if-no-files-found: warn
      - name: 门禁没跑过就别留下产物
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 命令替换会把 git 的清单吞掉，只剩一个退 1：日志里看不出是哪个文件被改写。
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -n "$changed" ]; then
            echo "::error::门禁跑完改写了被跟踪的文件："
            printf '%s\n' "$changed"
            exit 1
          fi

      # 运行页顶部的摘要：把结果留在这一页，不必点进每一步的日志里找。
      # 它必须排在 job 的最后一步：job.status 在执行到那一步时才求值，后面若还有判定步骤，
      # 后续步骤失败而摘要早已写成 success——那一行会成为唯一的结论面，且是错的。
      - name: 运行摘要
        if: always()
        # 脚本体是 bash 写法（`{ …; } >> "$GITHUB_STEP_SUMMARY"`）；矩阵含 windows 格，
        # 而 Windows runner 的默认 shell 是 pwsh，不显式声明的会解析失败。
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} / node ${{ matrix.node }}"
            echo ""
            echo "- 门禁：${{ job.status }}"
            echo '- 门禁命令：pnpm run check'
          } >> "$GITHUB_STEP_SUMMARY"
  # install-matrix：验的是「装出去之后」——入口可解析、普通 npm install 不需要
  # --legacy-peer-deps、每个子路径都能 import、公共类型没有因为未声明的依赖而退化成 any。
  install-matrix:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 只读。这个 job 在 PR 上也会跑，而 pnpm pack 会执行 PR 代码里的 prepack、npm install 会
    # 执行依赖的安装脚本；给它任何写入权限，等于让 PR 里的代码决定用那权限做什么。
    # 签来源证明需要的那两项权限留在下面的 attest job 里。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本仓的 workflow 不用 git 写动词，token 没必要留在 .git/config 里：
          # 后续步骤会跑仓库自己的 install/构建/测试脚本，也就跑得到依赖里的脚本。
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: 两个发布器各打一次包
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg/npm /tmp/pkg/pnpm
          npm pack --pack-destination /tmp/pkg/npm --ignore-scripts
          pnpm pack --pack-destination /tmp/pkg/pnpm
      # 交给 attest job。PR 的产物不签来源证明，传上去只是多一份没人认领的字节。
      - name: 留存 tarball 供 attest 使用
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-tarball
          path: /tmp/pkg/**/*.tgz
          retention-days: 7
          if-no-files-found: error
      - name: 干净目录安装 npm tarball（不带任何 flag）
        run: |
          set -euo pipefail
          tarball="$(find /tmp/pkg/npm -name '*.tgz' -print -quit)"
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null
          npm install "$tarball" --no-audit --no-fund
      - name: 逐子路径 import
        run: |
          set -euo pipefail
          cd /tmp/probe
          # 两个 config facet 的产物顶层分别 import `oxlint` / `vitest/config`——它们是消费方
          # 自备的工具链（本包不再声明为 peer，见 README 的 config 段），探针侧必须先装，
          # 否则缺包报的是 execNotFound 那种形状，会把「清单漏了入口」伪装成别的故障。
          npm install -D oxlint vitest --no-audit --no-fund
          # `./lib/card-ui` 是客户端子面，产物的顶层静态 import `react`；react 是 optional peer，
          # npm 不会自动装。探针按消费者实际提供的宿主运行时装上它，否则这一条子路径会以
          # ERR_MODULE_NOT_FOUND 假红，看起来像发布面缺入口。
          react_range=$(node -p "require('./node_modules/@jayyuen66/dsh-plugin-shared/package.json').peerDependencies.react")
          npm install -D "react@${react_range}" --no-audit --no-fund
          node --input-type=module -e '
          const NAME = "@jayyuen66/dsh-plugin-shared";
          // 名单取自装进来的那份产物自己的 exports，不在这里再抄一份：抄来的清单与发布面是
          // 两个真相，增删切面时工作流会静默落后，探针就再也看不见漏项。
          const manifest = (await import(NAME + "/package.json", { with: { type: "json" } })).default;
          // 按**目标形态**分档，不按名字分档：`.js` 那档按 ESM 装载，`.json` 那档是给 tsc
          // `extends` 读的纯 JSON（`./config/tsconfig*.json`），裸 import() 它会以
          // ERR_IMPORT_ATTRIBUTE_MISSING 失败——那是探针自己的写法问题，不是发布面坏了。
          // 两档之外的目标形态直接红：静默跳过等于把新形态的入口从不检查。
          const jsSubs = [];
          const jsonSubs = [];
          for (const [key, spec] of Object.entries(manifest.exports)) {
            if (key === "." || key === "./package.json") continue;
            const target = typeof spec === "string" ? spec : spec?.default;
            if (typeof target !== "string") throw new Error(`${key} 的 exports 目标不是字符串`);
            if (target.endsWith(".js")) jsSubs.push(key);
            else if (target.endsWith(".json")) jsonSubs.push(key);
            else throw new Error(`${key} 的目标形态不认识：${target}`);
          }
          if (jsSubs.length === 0) throw new Error("exports 里没有 .js 入口，这一档探针等于没跑");
          if (jsonSubs.length === 0) throw new Error("exports 里没有 .json 入口，这一档探针等于没跑");
          for (const s of jsSubs) {
            const mod = await import(NAME + s.slice(1));
            if (Object.keys(mod).length === 0) throw new Error(`${s} 没有任何导出`);
          }
          for (const s of jsonSubs) {
            const doc = (await import(NAME + s.slice(1), { with: { type: "json" } })).default;
            if (doc === null || typeof doc !== "object") throw new Error(`${s} 不是 JSON 对象`);
          }
          const root = await import(NAME);
          // 根入口与其它子路径同级断言：dist/index.d.ts 由 build-host.mjs 依据自己的 facets
          // 数组生成，facets 与 package.json 的 exports 漂一处，只有这条断言能报出来。
          if (Object.keys(root).length === 0) throw new Error("根入口没有任何导出");
          console.log(
            "入口分档：", jsSubs.length, "条 .js +", jsonSubs.length, "条 .json；根入口导出数:",
            Object.keys(root).length,
          );
          '
      - name: 消费方类型检查（两种 skipLibCheck 档位）
        run: |
          set -euo pipefail
          cd /tmp/probe
          npm install -D typescript@7.0.2 @types/node@26.6.3 --no-audit --no-fund
          # `./lib/card-ui` 的 .d.ts 引 `react` 类型；react 包不自带 .d.ts，类型面必须另装
          # @types/react，否则 surface.ts 会对这份声明报 TS2307。
          npm install -D @types/react@19.3.0 --no-audit --no-fund
          # 类型面的 peer 必须现量装齐再判：本包把 5 个只承载类型的 @deepseek-ai/* 声明为
          # optional peer，npm 于是不装它们，而 dist/**/*.d.ts 直接引它们的类型 ⇒ 裸装下 ① 收到
          # 7 条指向**本包自己** .d.ts 的 TS2307（"dsh-plugin-shared"这三个词命中的是文件路径，
          # 不是外部包名）、② 因类型退化成 any 收不到 TS2322。实测：装齐这几个 peer 后两支都转绿。
          # 清单不手抄：只取「产物 .d.ts 里引到 且 package.json 里声明过」的交集——未声明的引用
          # 因此装不进来，这道门原本要抓的"未声明依赖导致退化"照样有牙。宿主包与只作值导入的
          # dsh-output-retention 都不在这个交集里，所以探针的安装面不因此变大。
          # 这里**故意**让 $peers 不加引号：要的就是按空格切成多个包名当参数，不是被 IFS 咬。
          peers=$(node --input-type=module -e '
          import { readFileSync, readdirSync } from "node:fs";
          const ROOTDIR = "node_modules/@jayyuen66/dsh-plugin-shared";
          const pkg = JSON.parse(readFileSync(ROOTDIR + "/package.json", "utf8"));
          const declared = { ...pkg.dependencies, ...pkg.peerDependencies };
          const specifiers = [];
          const walk = (dir) => {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const p = dir + "/" + entry.name;
              if (entry.isDirectory()) walk(p);
              else if (entry.name.endsWith(".d.ts")) {
                for (const m of readFileSync(p, "utf8").matchAll(/from\s*["\x27](@deepseek-ai\/[^"\x27]+)["\x27]/gu)) specifiers.push(m[1]);
              }
            }
          };
          walk(ROOTDIR + "/dist");
          const pkgs = [...new Set(specifiers.map((s) => s.split("/").length > 2 ? s.split("/").slice(0, 2).join("/") : s))];
          const install = pkgs.filter((p) => declared[p] !== undefined).map((p) => p + "@" + declared[p]);
          if (install.length === 0) throw new Error("产物 .d.ts 里没有引用任何声明过的 @deepseek-ai 包：清单空了，这道门等于没跑");
          console.log(install.join(" "));
          ')
          echo "类型面 peer 现量（产物引到 ∩ 清单声明过）：${peers}"
          # 先按空白切成数组再按元素展开：裸 $peers 同时受分词与 glob 影响，且会触发 SC2086。
          # 上方已断言它非空，所以不存在「空数组 ⇒ 没有包名」的情况。
          read -r -a peer_args <<< "$peers"
          npm install -D "${peer_args[@]}" --no-audit --no-fund
          # ① 现在会把 `./config/*` 两份 .d.ts 也拉进 program，它们顶端 import `oxlint` 与
          # `vitest/config`——那是消费方自备的工具链（本包刻意不声明为 peer）。上一步「逐子路径
          # import」已经装过，这里再写一次是幂等的：不把"这一步必须在另一步之后跑"变成隐含前提。
          npm install -D oxlint vitest --no-audit --no-fund
          # ① 得覆盖**整个**公共类型面，不能只判 consumer.ts 引到的那几份 .d.ts：实测把一条未声明
          # 依赖插进 dist/types/text.d.ts，这一整步仍然 exit 0（绿着放过了）。切面清单同样不手抄，
          # 从装进来的那份 exports 现量取，分档纪律与「逐子路径 import」一致：`.json` 那两档是给
          # tsc `extends` 读的纯 JSON、不是模块，不进 program。
          node --input-type=module -e '
          import { writeFileSync } from "node:fs";
          const manifest = (await import("@jayyuen66/dsh-plugin-shared/package.json", { with: { type: "json" } })).default;
          const facets = [];
          for (const [key, spec] of Object.entries(manifest.exports)) {
            if (key === "." || key === "./package.json") continue;
            const target = typeof spec === "string" ? spec : spec?.default;
            if (typeof target === "string" && target.endsWith(".js")) facets.push(key);
          }
          if (facets.length === 0) throw new Error("exports 里没有 .js 切面：① 的扫描面空了，这道门等于没跑");
          writeFileSync("surface.ts", facets.map((f, i) => "import type * as facet" + i + " from \"@jayyuen66/dsh-plugin-shared" + f.slice(1) + "\";").join("\n") + "\n");
          console.log("① 的类型面扫描切面数：", facets.length);
          '
          cat > consumer.ts <<'TS'
          import { jobOutcomeOf } from "@jayyuen66/dsh-plugin-shared/lib/job-outcome";
          import type { JobOutcome, SettledProcess } from "@jayyuen66/dsh-plugin-shared/lib/job-outcome";
          import type { SessionEvent, ToolCallRecord } from "@jayyuen66/dsh-plugin-shared/lib/tool-events";
          import type { Locale } from "@jayyuen66/dsh-plugin-shared/lib/locale";
          export const ok: JobOutcome = jobOutcomeOf({ status: "completed", exitCode: 0, signal: null });
          export type Probe = [SessionEvent, ToolCallRecord, SettledProcess, Locale];
          TS
          cat > degrade.ts <<'TS'
          import { jobOutcomeOf } from "@jayyuen66/dsh-plugin-shared/lib/job-outcome";
          // 这条必须报错：类型一旦因为未声明的依赖退化成 any，编译器就拦不住非法入参。
          const wrong: string = jobOutcomeOf({ status: "not-a-status", exitCode: {}, signal: undefined });
          console.log(wrong);
          TS
          cat > tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2024","module":"NodeNext","moduleResolution":"NodeNext","strict":true,"noEmit":true,"types":["node"]},"include":["consumer.ts"]}
          JSON
          # 必须是 bash **数组**：写成带引号的字符串再未加引号展开，IFS 会按空格切开，
          # 第一个 token 变成 `(--noEmit`、最后一个变成 `--ignoreConfig)`，tsc 立刻 TS5023
          # 中止、**一个文件都没编译**。那样两道判定同时失真：上面那道 grep 必然无命中而空过，
          # 下面那道因拿不到 TS2322 而恒真 → job 必红，且报的是「类型退化成 any」这种
          # 指向错误方向的诊断。数组 + "${base[@]}" 才是逐槽位传参。
          base=(--noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2024 --types node --ignoreConfig)
          # 两道判定都**先捕获输出再匹配**，不写成 `tsc … | grep`：
          # `grep -q` 命中第一行即退出并关掉管道，tsc 还在写就收 SIGPIPE(141)，而本步开着
          # `set -o pipefail` 会把管道状态取成那个非零值 —— 于是「探针确实报出了 TS2322」
          # 这一支在管道里表现为**失败**（实测：去掉 pipefail 干扰后仍判红）。`|| true` 是
          # 因为 tsc 发现错误本就该非零退出，判据在输出内容上而不在退出码上。
          #
          # ① 本包自己的声明文件不得再有 TS2307（未声明的类型依赖）。这里必须 skipLibCheck=false：
          #    只有关掉它，tsc 才会走进去看本包 .d.ts 内部那条 import。program 里同时放 surface.ts
          #    （上面按 exports 现量生成的全部 .js 切面）——只判 consumer.ts 引到的那几份会漏掉其余切面。
          consumer_out=$(./node_modules/.bin/tsc "${base[@]}" --skipLibCheck false consumer.ts surface.ts 2>&1) || true
          if printf '%s\n' "$consumer_out" | grep -q 'dsh-plugin-shared'; then
            echo "本包声明文件仍有未解析的类型依赖"; exit 1
          fi
          # ② 退化探针：公共类型若因未声明的依赖退化成 any，非法入参就拦不住了。
          #    这道是 skipLibCheck **true**（布尔开关不带值即 true）——与 ① **不同档**，
          #    故注释不写「同一档」：这里只求入参被判死，不需要看 .d.ts 内部。
          degrade_out=$(./node_modules/.bin/tsc "${base[@]}" --skipLibCheck degrade.ts 2>&1) || true
          if ! printf '%s\n' "$degrade_out" | grep -q 'TS2322'; then
            echo "退化探针没有报错：公共类型又变成 any 了"; exit 1
          fi
      - name: pnpm 侧安装
        run: |
          set -euo pipefail
          tarball="$(find /tmp/pkg/pnpm -name '*.tgz' -print -quit)"
          mkdir -p /tmp/probe-pn && cd /tmp/probe-pn
          npm init -y >/dev/null
          pnpm add "$tarball"
          # 客户端子面静态 import `react`；optional peer 在 pnpm 下同样不会自动装。
          react_range=$(node -p "require('./node_modules/@jayyuen66/dsh-plugin-shared/package.json').peerDependencies.react")
          pnpm add -D "react@${react_range}"
          # 不能只停在「装上了」：publish.yml 真正用的发布器是 pnpm，npm 侧那套逐子路径
          # import 与消费方类型探针在这里必须再跑一遍，否则 pnpm 布局下的解析差异无人看。
          node --input-type=module -e '
          const NAME = "@jayyuen66/dsh-plugin-shared";
          // 只跑 lib 面：config 两面要消费方自备 oxlint / vitest 工具链，本目录没装（上面
          // 那条 npm 侧探针是专门装了才跑的）。名单同样读自产物的 exports。
          const manifest = (await import(NAME + "/package.json", { with: { type: "json" } })).default;
          const subs = Object.keys(manifest.exports).filter((s) => s.startsWith("./lib/"));
          if (subs.length === 0) throw new Error("exports 的 lib 面为空，这一档探针等于没跑");
          for (const s of subs) {
            const mod = await import(NAME + s.slice(1));
            if (Object.keys(mod).length === 0) throw new Error(`${s} 没有任何导出`);
          }
          console.log("pnpm 布局下子路径解析正常：", subs.length, "条 lib 子路径");
          '
          # 这个目录是 pnpm 管的（上面刚 `pnpm add` 过），装 devDep 也得用 pnpm：
          # 实测在 pnpm 布局的项目里跑 `npm install -D` 会以
          # "Cannot read properties of null (reading 'matches')" 崩掉——那是 npm 读不懂
          # pnpm 留下的 node_modules 树，与本包无关，但足以让这一档假红。
          pnpm add -D typescript@7.0.2 @types/node@26.6.3
          cat > probe.ts <<'TS'
          import { jobOutcomeOf } from "@jayyuen66/dsh-plugin-shared/lib/job-outcome";
          import type { JobOutcome } from "@jayyuen66/dsh-plugin-shared/lib/job-outcome";
          export const ok: JobOutcome = jobOutcomeOf({ status: "completed", exitCode: 0, signal: null });
          TS
          ./node_modules/.bin/tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext \
            --target ES2024 --types node --ignoreConfig --skipLibCheck probe.ts

  # 来源证明是给「这次运行打出来的这份产物」出的第三方可验凭据，不是多一步验证：
  # 签在 PR 上，那张证明看起来属于本仓，指向的却是 PR 里 prepack 脚本产出的字节。
  # 它也不能靠在同一 job 里给某一步加 if 来做——id-token 与 attestations 是 job 级权限，
  # 挂上去就等于 PR 也拿到了写入能力，权限面不会因为某一步被跳过而收窄。所以拆成独立 job。
  attest:
    needs: install-matrix
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # 官方 README 要求三枚：id-token 换 Sigstore 身份，attestations 落证明，
      # artifact-metadata 建产物存储记录。少最后一枚时证明仍能签，但存储记录那一步会失败。
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # 不检出仓库：要签的是上面那一份产物的字节，与工作树无关。
      - name: 取回 tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-tarball
          path: /tmp/pkg
      - name: 生成构建来源证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: /tmp/pkg/**/*.tgz

  # 依赖审查：只在 PR 上跑。它比的是「这个 PR 引入的依赖」与 GitHub Advisory Database，
  # 拦的是「今天能装、明天被披露有洞」那一类。push 上没有「引入」这个概念，所以不跑。
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本仓的 workflow 不用 git 写动词，token 没必要留在 .git/config 里：
          # 后续步骤会跑仓库自己的 install/构建/测试脚本，也就跑得到依赖里的脚本。
          persist-credentials: false
      - name: 依赖审查
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # 高危即拦；低危只记录，否则一次上游披露会把所有仓的门都堵上。
          fail-on-severity: high

  # 工作流文件自身的静态检查。它抓的是「YAML 合法但 GitHub 不接受」那一类：
  # 未知上下文、表达式语法、事件与输入拼写、shell 片段问题。job 级 if 里写 matrix
  # 就属于这一类——YAML 解析得过，但整份工作流在 GitHub 上加载不起来。
  #
  # 只读权限：这个 job 只读工作流文件，不该有写仓库的能力。
  # 覆盖本仓全部工作流（含 publish.yml）：只忽略 SC2016（理由见下），其余提示照常判红。
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本仓的 workflow 不用 git 写动词，token 没必要留在 .git/config 里：
          # 后续步骤会跑仓库自己的 install/构建/测试脚本，也就跑得到依赖里的脚本。
          persist-credentials: false
      - name: 跑 actionlint
        run: |
          set -euo pipefail
          # 版本与字节都钉住：release 的标签可以被上游移动，而这一个 job 是「工作流文件合不合法」
          # 的唯一判据——判据本身可换，等于没有判据。校验和取自该 release 的
          # actionlint_<版本>_checksums.txt，与本机下载到的产物逐字节核对过。
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$sha256" /tmp/actionlint.tar.gz | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # -ignore SC2016：探针脚本刻意用单引号包住 JS（脚本体里有 JS 模板串，
          # 交给 shell 展开就坏了）。这是 shellcheck 的误报，而 shellcheck 指令在
          # 跨行单引号构造上不被采信（已实测），所以只忽略这一条规则。
          # shell 先把 glob 展开，再把文件清单交给它。
          /tmp/actionlint -ignore 'SC2016' .github/workflows/*.yml
